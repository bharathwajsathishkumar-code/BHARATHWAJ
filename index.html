<!DOCTYPE html>
<html>
<head>
    <title>My Glass UI Web Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #0f2027,
                #203a43,
                #2c5364
            );

            color: white;
            overflow: hidden;
        }

        /* Background Glow */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: #00eaff;
            border-radius: 50%;
            top: 10%;
            left: 10%;
            filter: blur(100px);
            opacity: 0.6;
        }

        body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: #ff00cc;
            border-radius: 50%;
            bottom: 10%;
            right: 10%;
            filter: blur(100px);
            opacity: 0.5;
        }

        /* Glass Card */
        .glass-card {
            position: relative;
            z-index: 1;

            width: 450px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 25px 45px rgba(0, 0, 0, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.05);

            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        h2 {
            margin-bottom: 10px;
            color: #00eaff;
        }

        h3 {
            margin-top: 25px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            line-height: 1.6;
            color: #e0e0e0;
        }

        /* Skills */
        ul {
            list-style: none;
        }

        li {
            display: inline-block;
            margin: 5px;
            padding: 8px 15px;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;

            transition: 0.3s;
        }

        li:hover {
            transform: translateY(-5px);
            background: rgba(0, 234, 255, 0.25);
            box-shadow: 0 0 15px rgba(0, 234, 255, 0.5);
        }

        /* Link */
        a {
            display: inline-block;
            margin-top: 10px;
            color: #00eaff;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-shadow: 0 0 10px #00eaff;
        }

        /* Button */
        button {
            margin-top: 25px;
            padding: 12px 30px;

            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;

            background: rgba(255,255,255,0.15);
            color: white;

            font-size: 16px;
            cursor: pointer;

            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        button:hover {
            background: #00eaff;
            color: #071a20;
            box-shadow: 0 0 25px #00eaff;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="glass-card">

        <h1>Welcome to My Web Page</h1>

        <h2>About Me</h2>

        <p>
            Hello! My name is Bharath.
            I am learning HTML.
        </p>

        <h3>My Skills</h3>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>Python</li>
        </ul>

        <h3>My Website</h3>

        <a href="https://www.google.com" target="_blank">
            Visit Google
        </a>

        <br><br>

        <button onclick="alert('Hello Bharath!')">
            Click Me
        </button>

    </div>

</body>
</html>
